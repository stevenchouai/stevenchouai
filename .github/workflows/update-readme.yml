name: Update proof receipts

on:
  schedule:
    # Run daily at 08:00 UTC (16:00 SGT)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone sibling repos (read-only)
        run: |
          for repo in agent-scorecard personalWebsite digital-twin knowledge-harness; do
            git clone "https://github.com/stevenchouai/$repo.git" "repos/$repo" --depth=10 || true
          done

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update-proof-receipts.sh
          bash scripts/update-proof-receipts.sh

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update proof receipts [$(date +%Y-%m-%d)]"
            git push
          fi
