<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e5e7eb; }
      .muted { fill: #94a3b8; font-size: 18px; }
      .tiny { fill: #94a3b8; font-size: 13px; }
      .title { fill: #f8fafc; font-size: 42px; font-weight: 800; letter-spacing: -1px; }
      .section { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .label { fill: #f8fafc; font-size: 16px; font-weight: 700; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.3; rx: 14; }
      .accent { stroke: #22d3ee; } .violet { stroke: #a78bfa; } .green { stroke: #34d399; } .amber { stroke: #fbbf24; } .rose { stroke: #fb7185; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/><rect width="1200" height="700" fill="url(#grid)" opacity="0.75"/>
  <text x="60" y="70" class="title">StevenOS repository stack</text><text x="62" y="108" class="muted">Each layer has an upstream source, a local execution role, and downstream public proof.</text>
  <rect x="170" y="90" width="860" height="64" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="205" y="117" class="section">Public proof</text><text x="205" y="141" class="tiny">personalWebsite · GitHub profile · resume — turns artifacts into opportunity surface</text>
  <rect x="170" y="180" width="860" height="64" rx="16" fill="#0f172a" stroke="#fb7185" stroke-width="1.8"/>
  <text x="205" y="207" class="section">Evaluation</text><text x="205" y="231" class="tiny">agent-scorecard — decides whether agents deserve more autonomy</text>
  <rect x="170" y="270" width="860" height="64" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.8"/>
  <text x="205" y="297" class="section">Model + tool infra</text><text x="205" y="321" class="tiny">CLIProxyAPI · Hermes tools — normalizes access, tools, and side effects</text>
  <rect x="170" y="360" width="860" height="64" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="205" y="387" class="section">Agent runtime</text><text x="205" y="411" class="tiny">Hermes · OpenClaw — executes across chats, repos, devices, and workflows</text>
  <rect x="170" y="450" width="860" height="64" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="205" y="477" class="section">Identity layer</text><text x="205" y="501" class="tiny">digital-twin — preserves judgment, style, preference, and process</text>
  <rect x="170" y="540" width="860" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="205" y="567" class="section">Memory layer</text><text x="205" y="591" class="tiny">Obsidian · knowledge-harness — keeps raw inputs, compiled knowledge, and retrieval paths</text>
  <path d="M600 164 V188" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 254 V278" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 344 V368" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 434 V458" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 524 V548" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="660" class="muted">Inputs compound upward into verified public outputs.</text>
</svg>
