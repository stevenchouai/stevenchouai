<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img">
  <defs>
    <linearGradient id="bg-stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090e"/>
      <stop offset="50%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="layer-card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d111a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid-stack" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,1 7,4 0,7" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle { fill: #94a3b8; font-size: 14.5px; }
      .layer-title { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
      .layer-detail { fill: #94a3b8; font-size: 13px; font-weight: 400; }
      .badge-text { fill: #0284c7; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="url(#bg-stack)"/>
  <rect width="1200" height="660" fill="url(#grid-stack)"/>

  <!-- Header -->
  <text x="70" y="58" class="title">StevenOS Architecture Stack</text>
  <text x="70" y="86" class="subtitle">An integrated builder operating model: grounding real-world execution, autonomous agents, and life mastery.</text>

  <!-- Layer 1: Public Proof & Narrative -->
  <g transform="translate(70, 115)">
    <rect width="1060" height="80" rx="14" fill="url(#layer-card)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#f59e0b"/>
    <text x="32" y="36" class="layer-title">Layer 05 · Public Proof &amp; Conversion Plane</text>
    <text x="32" y="60" class="layer-detail">stevenchouai.github.io · /now · /future · /experience · /proof-chain — turns verified engineering artifacts into public authority</text>
    <rect x="910" y="26" width="120" height="28" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="970" y="44" text-anchor="middle" class="mono" fill="#f59e0b" font-size="11" font-weight="700">PUBLIC SURFACE</text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="195" x2="600" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Financial Systems & Reliability Core -->
  <g transform="translate(70, 220)">
    <rect width="1060" height="80" rx="14" fill="url(#layer-card)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#38bdf8"/>
    <text x="32" y="36" class="layer-title">Layer 04 · Financial Rails &amp; High-Reliability Core</text>
    <text x="32" y="60" class="layer-detail">Leading Global Fintech Platform — high-throughput payment rails, clearing gateways, distributed transaction consistency &amp; zero-defect SLA</text>
    <rect x="910" y="26" width="120" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="970" y="44" text-anchor="middle" class="mono" fill="#38bdf8" font-size="11" font-weight="700">PRODUCTION CORE</text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="300" x2="600" y2="320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: AI Agent Evaluation & Tooling -->
  <g transform="translate(70, 325)">
    <rect width="1060" height="80" rx="14" fill="url(#layer-card)" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#818cf8"/>
    <text x="32" y="36" class="layer-title">Layer 03 · AI Agent Evaluation &amp; Runtime Tooling</text>
    <text x="32" y="60" class="layer-detail">agent-scorecard · OpenClaw infrastructure — trace-first quality gates, autonomous verify loops, deterministic evaluation before permissions</text>
    <rect x="910" y="26" width="120" height="28" rx="8" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
    <text x="970" y="44" text-anchor="middle" class="mono" fill="#818cf8" font-size="11" font-weight="700">AI RUNTIME</text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="405" x2="600" y2="425" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Digital Twin & Memory -->
  <g transform="translate(70, 430)">
    <rect width="1060" height="80" rx="14" fill="url(#layer-card)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#10b981"/>
    <text x="32" y="36" class="layer-title">Layer 02 · Digital Twin &amp; Memory Synthesis</text>
    <text x="32" y="60" class="layer-detail">digital-twin · Obsidian Knowledge Base — personal memory wiki, cognitive reflection logs, explicit agent judgment &amp; operating context</text>
    <rect x="910" y="26" width="120" height="28" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="970" y="44" text-anchor="middle" class="mono" fill="#10b981" font-size="11" font-weight="700">KNOWLEDGE OS</text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="510" x2="600" y2="530" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Self-Mastery & Physical Vitality -->
  <g transform="translate(70, 535)">
    <rect width="1060" height="80" rx="14" fill="url(#layer-card)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#ec4899"/>
    <text x="32" y="36" class="layer-title">Layer 01 · Physical Vitality &amp; Digital Nomad Agency</text>
    <text x="32" y="60" class="layer-detail">Disciplined strength fitness (lean athletic physique), mental clarity, intentional living, and geographic freedom across global hubs</text>
    <rect x="910" y="26" width="120" height="28" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <text x="970" y="44" text-anchor="middle" class="mono" fill="#ec4899" font-size="11" font-weight="700">LIFE FOUNDATION</text>
  </g>
</svg>
