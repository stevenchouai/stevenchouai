<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Steven Chou proof chain map</title>
<desc id="desc">A dark technical diagram for Steven Chou's AI agent engineering work.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.5" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.65"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#67e8f9"/></marker>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<rect width="1200" height="620" rx="28" fill="url(#grid)" opacity="0.8"/>

<text x="60" y="76" fill="#f8fafc" font-family="Inter, system-ui" font-size="38" font-weight="800">Current Proof Chain</text>
<text x="60" y="112" fill="#94a3b8" font-family="Inter, system-ui" font-size="18">How the public repos connect: architecture research → operating layer → evaluation → knowledge runtime → public site.</text>
<g font-family="Inter, system-ui" font-size="16">
  <rect x="60" y="170" width="185" height="100" rx="18" fill="#082f49" stroke="#22d3ee"/>
  <text x="82" y="207" fill="#e0f2fe" font-weight="700">Architecture</text><text x="82" y="235" fill="#7dd3fc">Source-map research</text>
  <rect x="300" y="170" width="185" height="100" rx="18" fill="#052e2b" stroke="#34d399"/>
  <text x="322" y="207" fill="#dcfce7" font-weight="700">Operating Layer</text><text x="322" y="235" fill="#86efac">Identity + memory</text>
  <rect x="540" y="170" width="185" height="100" rx="18" fill="#3b1b55" stroke="#a78bfa"/>
  <text x="562" y="207" fill="#f3e8ff" font-weight="700">Scorecard</text><text x="562" y="235" fill="#c4b5fd">Token ROI gates</text>
  <rect x="780" y="170" width="185" height="100" rx="18" fill="#431407" stroke="#fb923c"/>
  <text x="802" y="207" fill="#ffedd5" font-weight="700">Knowledge Runtime</text><text x="802" y="235" fill="#fdba74">Obsidian harness</text>
  <rect x="1010" y="170" width="130" height="100" rx="18" fill="#4c0519" stroke="#fb7185"/>
  <text x="1032" y="207" fill="#ffe4e6" font-weight="700">Public Site</text><text x="1032" y="235" fill="#fda4af">Proof UI</text>
</g>
<path d="M245 220 H292" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M485 220 H532" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 220 H772" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M965 220 H1002" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
<g font-family="ui-monospace, monospace" font-size="15" fill="#cbd5e1">
  <text x="84" y="354">observable evidence</text><line x1="84" y1="370" x2="1080" y2="370" stroke="#334155" stroke-dasharray="6 8"/>
  <text x="84" y="414">source maps · runtime fixes · Feishu logs · eval reports · MDX writing · GitHub Pages</text>
  <text x="84" y="474">decision rule</text><line x1="84" y1="490" x2="1080" y2="490" stroke="#334155" stroke-dasharray="6 8"/>
  <text x="84" y="534" fill="#e2e8f0">If an agent cannot produce inspectable proof, it loses autonomy.</text>
</g>
<text x="1166" y="592" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="end">stevenchouai · trace over vibes</text>
</svg>
