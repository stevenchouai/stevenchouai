<text x="64" y="158" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="58" font-weight="800">Steven Chou</text>
<text x="64" y="210" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="28">Building the proof chain for practical agent engineering.</text>
<text x="64" y="258" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="20">Runtime debugging · tool-use discipline · memory routing · token ROI · public artifacts</text>
