<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e5e7eb; }
      .muted { fill: #94a3b8; font-size: 18px; }
      .tiny { fill: #94a3b8; font-size: 13px; }
      .title { fill: #f8fafc; font-size: 42px; font-weight: 800; letter-spacing: -1px; }
      .section { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .label { fill: #f8fafc; font-size: 16px; font-weight: 700; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.3; rx: 14; }
      .accent { stroke: #22d3ee; } .violet { stroke: #a78bfa; } .green { stroke: #34d399; } .amber { stroke: #fbbf24; } .rose { stroke: #fb7185; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.8"/>
  <circle cx="1030" cy="80" r="150" fill="#22d3ee" opacity="0.06"/>
  <circle cx="900" cy="330" r="220" fill="#8b5cf6" opacity="0.08"/>
  <text x="64" y="92" class="title">Steven Chou</text>
  <text x="66" y="132" class="muted">Personal AI Operating System · memory → agents → evals → proof</text>
  <rect x="64" y="178" width="244" height="116" class="box accent"/>
  <text x="88" y="218" class="section">Knowledge</text><text x="88" y="250" class="tiny">Obsidian · harness · context</text>
  <rect x="344" y="178" width="244" height="116" class="box violet"/>
  <text x="368" y="218" class="section">Identity</text><text x="368" y="250" class="tiny">digital twin · style · judgment</text>
  <rect x="624" y="178" width="244" height="116" class="box green"/>
  <text x="648" y="218" class="section">Agents</text><text x="648" y="250" class="tiny">Hermes · OpenClaw · tools</text>
  <rect x="904" y="178" width="244" height="116" class="box amber"/>
  <text x="928" y="218" class="section">Proof</text><text x="928" y="250" class="tiny">scorecard · website · resume</text>
  <path d="M308 236 H336" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M588 236 H616" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M868 236 H896" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="66" y="352" class="muted">Not a project shelf. A coherent builder entity: inputs become memory, memory becomes agents, agents produce verified public proof.</text>
</svg>
